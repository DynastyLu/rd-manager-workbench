services:
  api:
    build: .
    command: ["pnpm", "start:api"]
    environment:
      NODE_ENV: prod
      SERVICE_NAME: backend-core-platform-api
      INSTANCE_ID: api-1
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/backend_core_platform?schema=platform
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_PREFIX: backend-core-platform
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: backend-core-platform
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: true
      OCR_ALLOWED_MIME_TYPES: image/png,image/jpeg,image/jpg
      OCR_MAX_IMAGE_BYTES: 10485760
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  ocr-worker:
    build: .
    command: ["pnpm", "start:ocr-worker"]
    environment:
      NODE_ENV: prod
      SERVICE_NAME: backend-core-platform-ocr-worker
      INSTANCE_ID: ocr-worker-1
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/backend_core_platform?schema=platform
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_PREFIX: backend-core-platform
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: backend-core-platform
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: true
      OCR_WORKER_CONCURRENCY: 2
      OCR_ALLOWED_MIME_TYPES: image/png,image/jpeg,image/jpg
      OCR_MAX_IMAGE_BYTES: 10485760
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  migrate:
    build: .
    command: ["pnpm", "prisma:migrate:deploy"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/backend_core_platform?schema=platform
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: backend_core_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d backend_core_platform"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/backend-core-platform",
      ]

volumes:
  postgres-data:
  redis-data:
  minio-data:
