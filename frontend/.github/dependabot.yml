version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    groups:
      react:
        patterns:
          - react
          - react-dom
          - '@types/react*'
      testing:
        patterns:
          - vitest
          - '@vitest/*'
          - '@testing-library/*'
          - '@playwright/*'
      storybook:
        patterns:
          - storybook
          - '@storybook/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
